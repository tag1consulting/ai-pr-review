name: Lint & Test

on:
  push:
    branches: [main]
    paths: ['**.py', 'tests/**', 'pyproject.toml', 'ai_pr_review/**']
  # No `paths:` filter on pull_request: `Python (3.14)` is a required check on
  # main, and a required check whose workflow is skipped by a path filter
  # never reports, leaving docs-only and workflow-only PRs stuck at
  # "Expected -- waiting for status".
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and dev dependencies
        run: |
          pip install --quiet ".[dev,context]" || pip install --quiet -e . pytest ruff mypy pydantic httpx click

      - name: ruff check
        if: matrix.python-version == '3.14'
        run: ruff check ai_pr_review/

      - name: mypy
        if: matrix.python-version == '3.14'
        run: mypy --strict ai_pr_review/

      - name: pytest
        run: python -m pytest tests/python/ -v --tb=short
