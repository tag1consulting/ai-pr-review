name: Live Model Canary

# Scheduled, not per-PR-blocking: this makes real, billed API calls per
# model/agent combination, so it runs on a schedule rather than gating every
# PR. See tests/canary/live_model_canary.py and the #592 test plan (Tier 2)
# for background: unit tests can't catch a model-behavior surprise (they
# never call the real API), and a live e2e run against a small diff (as
# happened when Sonnet 5 became the default in #583) can miss a failure mode
# that only manifests on a genuinely demanding diff.
on:
  schedule:
    # Weekly, Monday 09:00 UTC. Not nightly: this is a slow-drift detector
    # (new model behavior), not a fast-moving signal, and API cost scales
    # with frequency.
    - cron: '0 9 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: model-canary
  cancel-in-progress: false

jobs:
  canary:
    name: Live model canary
    runs-on: ubuntu-latest
    # Three providers with two models and two agents each run one call after
    # another: 12 calls. Four Anthropic calls alone took 5 to 6 minutes, and
    # each call has a 180 s client timeout, so 20 minutes was not enough.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and dev dependencies
        run: pip install --quiet ".[dev]" || pip install --quiet -e . httpx anyio

      - name: Run live model canary
        id: canary
        env:
          ANTHROPIC_API_KEY: ${{ secrets.AI_REVIEW_API_KEY }}
          # The canary runs every provider whose key is set, against that
          # provider's pinned defaults (PROVIDER_MODELS in the script).
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: python tests/canary/live_model_canary.py

      - name: File an issue on failure
        # cancelled() as well as failure(): a job that hits timeout-minutes is
        # cancelled, not failed, so failure() alone would file nothing for a
        # canary that ran out of time.
        if: (failure() || cancelled()) && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Routed through env vars (not interpolated directly via ${{ }} into the
          # body string below) so that arbitrary text in a provider error message
          # can't be read as shell syntax -- these values only ever reach bash as
          # quoted variable expansions.
          ALL_QUOTA_EXHAUSTED: ${{ steps.canary.outputs.all_quota_exhausted }}
          FAILURE_DETAIL: ${{ steps.canary.outputs.failure_detail }}
        run: |
          # #636: this used to unconditionally claim every failure was "the same
          # class as #592" (Sonnet 5 adaptive thinking exhausting max_tokens). It
          # wasn't -- #636 itself was the CI key's Anthropic workspace usage limit,
          # not a model-behavior regression, and the hardcoded text sent whoever
          # triaged it chasing the wrong root cause. Word it from what actually
          # happened instead.
          if [ -z "$FAILURE_DETAIL" ]; then
            EXPLANATION="The canary did not report any per-call result, so the cause is not known from this issue alone. Possible causes: it ran past the job's timeout-minutes limit and was cancelled, it crashed before writing its output (for example an import error or a dependency install failure), or no provider key was set so no call was made. Check the run log, starting with the last call it finished."
          elif [ "$ALL_QUOTA_EXHAUSTED" = "true" ]; then
            EXPLANATION="Every failing model/agent combination hit a provider API quota, rate-limit or billing error (see the provider on each line below). This looks like a key's usage limit, not a model-behavior regression or code bug. Re-run manually (workflow_dispatch) once the limit resets to confirm. No investigation is needed unless it recurs after that."
          else
            EXPLANATION="See the failure detail below for what actually happened before assuming a cause. Each line names the provider, model and agent. A wrong stop reason with a high thinking-token count may be the same class of failure as #592 (thinking exhausting the output limit before any text). A missing or invalid json-findings block means the model answered but its review would be dropped. Check the stop_reason and error text first: #636 looked like a #592 repeat from the title alone and turned out to be an unrelated API quota block."
          fi
          BODY="The scheduled live-model canary (\`tests/canary/live_model_canary.py\`) failed. See the [failed run]($RUN_URL) for full logs.

          $EXPLANATION

          \`\`\`
          $FAILURE_DETAIL
          \`\`\`"
          gh issue create \
            --repo "$REPO" \
            --title "Live model canary failed on $(date -u +%Y-%m-%d)" \
            --label bug \
            --body "$BODY"
