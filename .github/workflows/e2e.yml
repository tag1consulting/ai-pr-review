name: E2E Release Gate

# Deterministic replacement for the old LLM-orchestrated e2e workflow
# (ai-pr-review-e2e.js). See tests/e2e/README.md for the harness this
# workflow drives. This is a release-branch merge gate: it opens throwaway
# PRs/MRs on the ai-pr-review-test repos across GitHub, GitLab, and
# Bitbucket, runs the built review image against them, and verifies posting
# deterministically (tests/e2e/verify.py) instead of via LLM transcription.
#
# Live legs only run for same-repo PRs whose HEAD branch matches
# `release/*`. All other PRs get a same-named passing check with the legs
# skipped, so this never blocks ordinary development.
#
# `pull_request` (not `pull_request_target`) is used deliberately: this job
# builds and runs PR code with real secrets, and must never do that for a
# fork PR. A `pull_request` `branches:` filter matches the PR's BASE branch,
# not its head, so branch selection is done in `if:` against
# `github.head_ref` instead (a documented correctness bug in an earlier
# draft of this workflow used `branches: [release/*]`, which would have
# matched merges *into* a branch called release/*, not releases themselves).

on:
  pull_request:
    # No `synchronize`: a push to an existing release/* PR must not auto-fire
    # a real, billed live run with no per-push confirmation -- that was in
    # direct tension with this repo's own checkpoint-before-live-run
    # convention (see tests/e2e/README.md's cost warning). Re-running after
    # a push now requires a deliberate `workflow_dispatch`, which is itself
    # a natural per-invocation confirmation point.
    types: [opened, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      mode:
        description: "full or quick"
        default: full
      platforms:
        description: "comma-separated platform list"
        default: "github,gitlab,bitbucket"
      max_cost_usd:
        description: >-
          Per-platform AI_MAX_COST_USD ceiling. The harness's own default
          ($2.00) is well below the real worst-case pre-flight estimate for
          a full-mode review of this fixture (~$4.34, confirmed live
          2026-09-25) -- that estimate deliberately assumes every agent uses
          its full max_output_tokens cap (see cost_ceiling.py's docstring),
          not typical actual spend (the same run's real cost was $1.22).
          $6.00 leaves headroom above the observed worst case without
          disabling the ceiling as a genuine runaway-cost guard.
        default: "6.00"
  schedule:
    # Weekly credential/access check only -- no LLM calls, no PRs opened.
    # Catches an expired token before release day instead of during it.
    - cron: '0 8 * * 1'

concurrency:
  group: e2e-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  eligibility:
    name: Eligibility and offline checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      is_release: ${{ steps.check.outputs.is_release }}
      platforms_json: ${{ steps.check.outputs.platforms_json }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and dev/context extras
        run: pip install --quiet ".[dev,context]"

      - name: Offline harness tests
        run: |
          ruff check tests/e2e/ tests/python/e2e_harness/
          mypy --strict tests/e2e/
          # python -m pytest (not bare `pytest`), matching lint.yml's convention:
          # `-m` puts the repo root on sys.path, which `from tests.e2e.config
          # import ...`-style imports in test_verify.py depend on. Bare `pytest`
          # does not add it, and failed here on the first real CI run (a bug this
          # comment exists to prevent reintroducing).
          python -m pytest tests/python/e2e_harness -q

      - name: Determine release eligibility and platform selection
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          # github.head_ref is only populated for pull_request events; a
          # workflow_dispatch run has no PR context, so its "which branch is
          # this" signal is ref_name (the branch selected when dispatching).
          REF_NAME: ${{ github.ref_name }}
          IS_SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          # workflow_dispatch inputs are set by whoever triggers the manual
          # run (a repo maintainer via the Actions UI/API), not derived from
          # PR/issue content -- routed through env, not interpolated
          # directly into `run:`, as a matter of course rather than because
          # this specific input is attacker-reachable.
          DISPATCH_PLATFORMS: ${{ github.event.inputs.platforms }}
        run: |
          is_release_ref=false
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [[ "$REF_NAME" == release/* ]]; then
            is_release_ref=true
          elif [ "$IS_SAME_REPO" = "true" ] && [ "$IS_DRAFT" != "true" ] && [[ "$HEAD_REF" == release/* ]]; then
            is_release_ref=true
          fi
          echo "is_release_ref=${is_release_ref}" >> "$GITHUB_OUTPUT"

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
            # Build the JSON array the `e2e` job's matrix consumes via
            # fromJSON(). Previously this input was declared but ignored --
            # every dispatch ran all three platforms regardless of what was
            # requested.
            # Lowercased before building the array: validate_platforms() does
            # a set-based unknown/duplicate check, so "GitHub,github" would
            # otherwise slip past duplicate detection as two distinct
            # strings and fail much later, inside a matrix job's
            # build_adapter() lookup, with a far less actionable error.
            platforms_json=$(echo "${DISPATCH_PLATFORMS:-github,gitlab,bitbucket}" \
              | tr ',' '\n' | tr 'A-Z' 'a-z' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | sed '/^$/d' | jq -R . | jq -s -c .)
            echo "platforms_json=${platforms_json}" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "schedule" ]; then
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            echo "platforms_json=[]" >> "$GITHUB_OUTPUT"
          elif [ "$is_release_ref" = "true" ]; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
            echo 'platforms_json=["github","gitlab","bitbucket"]' >> "$GITHUB_OUTPUT"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            echo "platforms_json=[]" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate platform selection (no network)
        if: steps.check.outputs.is_release == 'true'
        env:
          PLATFORMS_JSON: ${{ steps.check.outputs.platforms_json }}
          IS_RELEASE_REF: ${{ steps.check.outputs.is_release_ref }}
        run: |
          # A workflow_dispatch targeting a release/* branch is held to the
          # same full-triple requirement as the automatic PR trigger --
          # otherwise, since `synchronize` no longer auto-reruns the gate,
          # a single-platform manual dispatch would be the only way to
          # refresh e2e-gate after a push, and it could green the gate
          # having exercised only one of the three required platforms.
          # A dispatch NOT targeting a release/* branch (e.g. an ad hoc
          # single-platform smoke test on a feature branch) may request any
          # valid non-empty subset.
          # A plain `var=$(...)` assignment (not `for p in $(...)`, and not
          # `mapfile < <(...)` -- process substitution doesn't propagate the
          # substituted command's exit status either) so a jq parse failure
          # is actually caught: a failed command substitution inside a
          # `for ... in $(...)` word list, or read via `< <(...)`, is NOT
          # surfaced by `set -e` or by `||` on the consuming command -- it
          # just yields empty output, and the loop silently runs zero times.
          # That looks identical to "zero platforms selected" below, hiding
          # a real jq/environment bug behind a misleading "no platforms"
          # message.
          platform_list_raw=$(jq -r '.[]' <<<"$PLATFORMS_JSON") || {
            echo "::error::failed to parse platforms_json=${PLATFORMS_JSON}" >&2
            exit 1
          }
          args=()
          while IFS= read -r p; do
            [ -n "$p" ] && args+=(--platforms "$p")
          done <<< "$platform_list_raw"
          if [ "${#args[@]}" -eq 0 ]; then
            echo "::error::No platforms selected (empty or whitespace-only platforms input) -- refusing to fall back to run_e2e's own default." >&2
            exit 1
          fi
          if [ "$IS_RELEASE_REF" = "true" ]; then
            python -m tests.e2e.run_e2e plan --profile release "${args[@]}"
          else
            python -m tests.e2e.run_e2e plan "${args[@]}"
          fi

  weekly-preflight:
    name: Weekly credential check
    needs: eligibility
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: pip install --quiet ".[dev,context]"

      - name: Preflight all platforms (no LLM calls, no PRs)
        id: preflight
        env:
          E2E_GITHUB_TOKEN: ${{ secrets.E2E_GITHUB_TOKEN }}
          E2E_GITHUB_REVIEWER_TOKEN: ${{ secrets.E2E_GITHUB_REVIEWER_TOKEN }}
          E2E_GITLAB_TOKEN: ${{ secrets.E2E_GITLAB_TOKEN }}
          E2E_BITBUCKET_EMAIL: ${{ secrets.E2E_BITBUCKET_EMAIL }}
          E2E_BITBUCKET_TOKEN: ${{ secrets.E2E_BITBUCKET_TOKEN }}
        run: python -m tests.e2e.run_e2e preflight --platforms github --platforms gitlab --platforms bitbucket

      - name: File an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create --repo "$REPO" --label bug \
            --title "E2E weekly preflight failed" \
            --body "The scheduled e2e-harness credential preflight failed. See the run log for which platform: ${RUN_URL}"

  build:
    name: Build review image
    needs: eligibility
    if: needs.eligibility.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image (no secrets)
        uses: docker/build-push-action@v7
        with:
          context: .
          tags: ai-pr-review:e2e-candidate
          outputs: type=docker,dest=/tmp/ai-pr-review-e2e-image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: actions/upload-artifact@v7
        with:
          name: e2e-image
          path: /tmp/ai-pr-review-e2e-image.tar
          retention-days: 1

  e2e:
    name: E2E (${{ matrix.platform }})
    needs: [eligibility, build]
    if: needs.eligibility.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.eligibility.outputs.platforms_json) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: pip install --quiet ".[dev,context]"

      - uses: actions/download-artifact@v8
        with:
          name: e2e-image
          path: /tmp

      - name: Load image
        run: docker load --input /tmp/ai-pr-review-e2e-image.tar

      - name: Run e2e harness
        id: run
        env:
          # The harness must exercise the image built from THIS PR's code,
          # not whatever is already published under :dev -- that is the
          # entire point of a release gate. See run_e2e.py's _run_container.
          AI_PR_REVIEW_E2E_IMAGE: ai-pr-review:e2e-candidate
          E2E_ANTHROPIC_API_KEY: ${{ secrets.AI_REVIEW_API_KEY }}
          E2E_GITHUB_TOKEN: ${{ secrets.E2E_GITHUB_TOKEN }}
          E2E_GITHUB_REVIEWER_TOKEN: ${{ secrets.E2E_GITHUB_REVIEWER_TOKEN }}
          E2E_GITLAB_TOKEN: ${{ secrets.E2E_GITLAB_TOKEN }}
          E2E_BITBUCKET_EMAIL: ${{ secrets.E2E_BITBUCKET_EMAIL }}
          E2E_BITBUCKET_TOKEN: ${{ secrets.E2E_BITBUCKET_TOKEN }}
        run: |
          python -m tests.e2e.run_e2e run \
            --platforms "${{ matrix.platform }}" \
            --mode "${{ github.event.inputs.mode || 'full' }}" \
            --max-cost-usd "${{ github.event.inputs.max_cost_usd || '6.00' }}" \
            --out-dir "$GITHUB_WORKSPACE/e2e-out/${{ matrix.platform }}"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-evidence-${{ matrix.platform }}
          path: e2e-out/${{ matrix.platform }}
          retention-days: 14

      # No separate cancellation-cleanup step: run_e2e.py installs its own
      # SIGTERM/SIGINT handler (_install_signal_handlers) that closes any
      # PR/MR the run opened before the process exits. A GitHub Actions
      # job cancellation sends SIGTERM to the step's process, which this
      # handler catches directly -- a second out-of-process cleanup
      # invocation would just race the first one.

  e2e-gate:
    name: e2e-gate
    needs: [eligibility, build, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate gate
        run: |
          if [ "${{ needs.eligibility.outputs.is_release }}" != "true" ]; then
            echo "Not a release/* PR -- e2e legs not required."
            exit 0
          fi
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "Build job did not succeed: ${{ needs.build.result }}"
            exit 1
          fi
          if [ "${{ needs.e2e.result }}" != "success" ]; then
            echo "One or more e2e legs did not succeed: ${{ needs.e2e.result }}"
            echo "A skipped or cancelled leg counts as a failure here -- it is not evidence of a passing release."
            exit 1
          fi
          echo "All required e2e legs passed."
