name: Model watch

# Weekly, read-only check for Anthropic, OpenAI and Google models that are newer than
# this repo's pinned default models. It opens ONE issue per newer model and never changes
# a default: bumping a default needs a pricing row, per-model effort, thinking and
# temperature handling, and a live canary run (see CLAUDE.md), so a person does it.
#
# Listing models makes no model calls, so it costs no tokens. Anthropic uses the same API
# key secret as the live model canary. OpenAI and Google use the OPENAI_API_KEY and
# GOOGLE_API_KEY secrets, and a provider whose secret is not set is skipped. A key that
# can only list models (an OpenAI restricted key with "Models: read", a Google key
# limited to the Generative Language API) is enough.
on:
  schedule:
    # Monday 10:00 UTC, an hour after the weekly live model canary.
    - cron: '0 10 * * 1'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Print what would be opened, but open nothing'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write  # open the "new model available" issue

concurrency:
  group: model-watch
  cancel-in-progress: false

jobs:
  watch:
    name: Check for newer default models
    # Forks have neither the API key secret nor any use for this issue.
    if: github.repository == 'tag1consulting/ai-pr-review'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        # The watcher reads the pinned defaults from the real ReviewConfig.
        run: pip install --quiet .

      - name: Look for newer models
        env:
          ANTHROPIC_API_KEY: ${{ secrets.AI_REVIEW_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -euo pipefail
          args=()
          if [ "${DRY_RUN:-false}" = "true" ]; then
            args+=(--dry-run)
          fi
          python scripts/model_watch.py "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
