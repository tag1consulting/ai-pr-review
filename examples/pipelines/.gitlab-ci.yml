# GitLab CI starter for ai-pr-review.
#
# Copy this file to `.gitlab-ci.yml` at the root of your GitLab repository.
#
# Required CI/CD variables (Settings -> CI/CD -> Variables):
#   ANTHROPIC_API_KEY   (masked): or OPENAI_API_KEY / GOOGLE_API_KEY etc.
#                                    depending on AI_PROVIDER.
#   GITLAB_TOKEN        (masked): Project access token with `api` scope.
#                                    Falls back to CI_JOB_TOKEN (limited scopes).
#
# Optional CI/CD variables:
#   AI_PROVIDER             (default: anthropic)
#   AI_REVIEW_MODE          (default: empty, which uses the policy.yml route and else quick; set to 'full' for deep agents)
#   AI_REVIEW_IMAGE_TAG     (default: latest; set to 'dev' to dogfood pre-release
#                            builds, or pin to a release like '2.24.1': image
#                            tags strip the 'v' prefix from the git tag)
#   AI_IGNORE_MERGE_COMMITS (default: true; strip base-branch merges from diff; set to false to include upstream merges)
#
# Opt-in capabilities (require the Python engine, which is the default):
#   AI_CONTEXT_ENRICHMENT  (default: false; tree-sitter symbol-context injection)
#   AI_FINDING_BADGES      (default: true; set to false to hide the evidence label and
#                           score beside each finding)
#   AI_SARIF_PATHS         (default: ''; comma-separated SARIF 2.1.0 file paths
#                           to merge as findings)
# Note: AI_FEEDBACK_LOOP (learning loop) works on GitHub and Bitbucket: see
# docs/learning-loop.md. On GitLab it does nothing.
#
# GIT_STRATEGY=clone + GIT_DEPTH=0 are required: the Python engine calls
# `git fetch origin $BASE_REF` to compute the diff, and the default
# shallow GitLab CI clone does not always include the base branch history.
#
# The `rules:` block restricts this job to merge request pipelines only.
# CI_MERGE_REQUEST_IID and related MR variables are only populated in
# merge request pipelines (triggered by rules with $CI_MERGE_REQUEST_IID).

image:
  # AI_REVIEW_IMAGE_TAG controls which container tag is pulled.  Defaulted
  # below in the `variables:` block to 'latest'; override by setting the
  # variable in project CI/CD settings (e.g. 'dev' to dogfood pre-release
  # builds, or '2.24.1' to pin a release: image tags strip the 'v' prefix
  # from the git tag, per docker/metadata-action's semver pattern in
  # publish-image.yml).
  #
  # NOTE: GitLab Runner expands $VAR / ${VAR} in image.name via Go's
  # os.Expand(), which does NOT support bash-style ${VAR:-default}
  # parameter expansion.  The default must come from `variables:` below.
  name: ghcr.io/tag1consulting/ai-pr-review:$AI_REVIEW_IMAGE_TAG

variables:
  GIT_STRATEGY: clone
  GIT_DEPTH: "0"
  # Default image tag.  Project CI/CD variables override this.
  AI_REVIEW_IMAGE_TAG: latest

ai-review:
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - export VCS_PROVIDER=gitlab
    - export AI_PROVIDER="${AI_PROVIDER:-anthropic}"
    # Empty (default): defer to .ai-pr-review/policy.yml route
    # matching if present, else 'quick'. Set AI_REVIEW_MODE=full to override.
    - export AI_REVIEW_MODE="${AI_REVIEW_MODE:-}"
    - export AI_IGNORE_MERGE_COMMITS="${AI_IGNORE_MERGE_COMMITS:-true}"
    # Opt-in capabilities (Python engine only: the default)
    - export AI_CONTEXT_ENRICHMENT="${AI_CONTEXT_ENRICHMENT:-false}"
    - export AI_SARIF_PATHS="${AI_SARIF_PATHS:-}"
    - export PR_NUMBER="$CI_MERGE_REQUEST_IID"
    - export MR_IID="$CI_MERGE_REQUEST_IID"
    - export BASE_REF="$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
    - export HEAD_REF="$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME"
    - export HEAD_SHA="$CI_COMMIT_SHA"
    - export GITLAB_PROJECT_ID="$CI_PROJECT_ID"
    - export GITLAB_DIFF_BASE_SHA="$CI_MERGE_REQUEST_DIFF_BASE_SHA"
    - export GITLAB_TOKEN="${GITLAB_TOKEN:-}"
    - export GITHUB_REPOSITORY="$CI_PROJECT_PATH"
    # ANTHROPIC_API_KEY (or your provider's key) comes from CI/CD variables.
    # Optional: uncomment to customize behavior
    # - export GITLAB_BOT_USERNAME="my-bot-user"  # Skip a /user API call
    # - export AI_ENABLE_SUGGESTIONS=true          # Default; set to 'false' to disable
    # - export AI_MAX_INLINE=25                    # Max inline discussions per run
    # - export AI_CONFIDENCE_THRESHOLD=75          # Min confidence for findings
    # Keep the checked-out merge request tree off the Python import path. Newer
    # images set this already. Keep it here in case you pin an older image tag.
    - export PYTHONSAFEPATH=1
    - python3 -m ai_pr_review review
